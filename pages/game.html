<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오둑 게임</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main class="game-layout">
        <section class="panel">
            <h1>오둑</h1>
            <p id="status">로그인 확인 중...</p>
            <p>흑 <span id="blackScore">0</span> : 백 <span id="whiteScore">0</span></p>
            <p id="clockInfo">제한시간: 기본 5분 + 20초 초읽기</p>
            <p id="myColor">색상: 미정</p>

            <div id="matchPanel">
                <button id="matchBtn">매칭 시작</button>
            </div>

            <div id="bidPanel" class="hidden">
                <h2>흑 입찰</h2>
                <p>0~3점까지 양보할 수 있습니다. 더 많이 양보한 사람이 흑이 됩니다.</p>
                <label>양보 점수 <input id="bidInput" type="number" min="0" max="3" value="0"></label>
                <button id="bidBtn">입찰 제출</button>
            </div>

            <div id="augmentPanel" class="hidden">
                <h2>증강 선택</h2>
                <p id="augmentHelp"></p>
                <div id="augmentChoices" class="augment-list"></div>
                <button id="augmentBtn">증강 확정</button>
            </div>

            <div id="log" class="log"></div>
            <a id="leaveBtn" class="button-link hidden" href="lobby.html">나가기</a>
        </section>

        <section class="board-stage" aria-label="오둑판 집중 정보 영역">
            <div id="phaseOverlay" class="phase-overlay"></div>
            <div id="playerHud" class="board-hud"></div>
            <section id="board" class="board" aria-label="11x11 오둑판"></section>
            <div id="augmentSummary" class="augment-summary"></div>
            <div id="boardActions" class="board-actions"></div>
        </section>
        <aside id="gameInfo" class="game-info hidden" aria-label="게임 정보"></aside>

        <div id="decisionBackdrop" class="decision-backdrop hidden" aria-live="polite">
            <div id="boardBidPanel" class="board-decision-card hidden"></div>
            <div id="boardSelectionPanel" class="board-decision-card hidden"></div>
        </div>
      
        <div id="surrenderBackdrop" class="decision-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="surrenderTitle">
            <div class="board-decision-card surrender-card">
                <h2 id="surrenderTitle">정말 항복하시겠습니까?</h2>
                <p>확인하면 즉시 패배 처리되고 로비로 이동합니다.</p>
                <div class="confirm-actions">
                    <button type="button" class="danger-fill" id="surrenderConfirmBtn">예, 항복합니다</button>
                    <button type="button" id="surrenderCancelBtn">아니오</button>
                </div>
            </div>
        </div>

        <div id="augmentModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="augmentModalTitle">
            <article class="modal-card">
                <button id="augmentModalClose" class="modal-close" type="button" aria-label="닫기">×</button>
                <h2 id="augmentModalTitle"></h2>
                <div id="augmentModalBody" class="modal-body"></div>
            </article>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const board = document.getElementById('board');
        const socket = io(API_BASE_URL, { withCredentials: true });
        let roomId = null;
        let currentState = null;
        let mySocketId = null;
        let myColor = null;
        let pendingBidValue = 0;
        let boardSelectedAugmentIds = [];
        
        // 초기화
        for (let y = 0; y < 11; y += 1) {
            for (let x = 0; x < 11; x += 1) {
                const cell = document.createElement('button');
                cell.className = 'cell';
                cell.dataset.x = x;
                cell.dataset.y = y;
                cell.addEventListener('click', () => {
                    if (!roomId || currentState?.phase !== 'playing') return;
                    if (currentState.turn !== myColor) return;
                    if (currentState.board[y][x]) return;
                    socket.emit('placeStone', { roomId, x, y });
                });
                board.appendChild(cell);
            }
        }

        requireLogin().then(() => {
            document.getElementById('status').textContent = '매칭을 시작하세요.';
        });

        socket.on('connect', () => {
            mySocketId = socket.id;
        });

        document.getElementById('matchBtn').addEventListener('click', () => {
            socket.emit('joinMatch');
            document.getElementById('matchBtn').disabled = true;
            document.getElementById('status').textContent = '상대를 기다리는 중...';
        });

        document.getElementById('bidInput').addEventListener('input', (event) => {
            pendingBidValue = Number(event.target.value);
        });

        document.getElementById('bidBtn').addEventListener('click', () => {
            socket.emit('submitBid', { roomId, bid: pendingBidValue });
        });

        document.getElementById('augmentBtn').addEventListener('click', () => {
            if (currentState?.phase !== 'augment-selection') return;
            const stepColor = currentState.selection?.steps?.[currentState.selection.index]?.color;
            if (stepColor !== myColor) return;
            const augmentIds = [...document.querySelectorAll('#augmentChoices input:checked')].map((input) => Number(input.value));
            socket.emit('selectAugments', { roomId, augmentIds });
        });

        document.getElementById('leaveBtn').addEventListener('click', (event) => {
            event.preventDefault();
            if (roomId && currentState?.phase !== 'finished') {
                emitAndGoLobby('leaveRoom');
            } else if (document.getElementById('matchBtn').disabled) {
                emitAndGoLobby('cancelMatch');
            } else {
                window.location.href = 'lobby.html';
            }
        });

        function emitAndGoLobby(eventName) {
            let moved = false;
            const goLobby = () => {
                if (moved) return;
                moved = true;
                window.location.href = 'lobby.html';
            };
            socket.timeout(1000).emit(eventName, () => { goLobby(); });
            setTimeout(goLobby, 1200);
        }

        socket.on('matchFound', (data) => {
            roomId = data.roomId;
            document.getElementById('matchPanel').classList.add('hidden');
        });

        socket.on('gameState', (state) => {
            const oldPhase = currentState?.phase;
            currentState = state;
            myColor = findMyColor(state);
            
            // 페이즈가 변경될 때 선택 값 초기화
            if (oldPhase !== state.phase) {
                boardSelectedAugmentIds = [];
            }
            
            renderState(state);
        });

        socket.on('gameError', (msg) => {
            document.getElementById('matchBtn').disabled = false;
            alert(msg);
        });

        socket.on('roomClosed', (msg) => {
            document.getElementById('matchBtn').disabled = false;
            document.getElementById('matchPanel').classList.remove('hidden');
            roomId = null;
            currentState = null;
            alert(msg);
            window.location.href = 'lobby.html';
        });

        function findMyColor(state) {
            if (state.players.black?.socketId === mySocketId) return 'black';
            if (state.players.white?.socketId === mySocketId) return 'white';
            return null;
        }

        function mySeat(state) {
            return Object.values(state.seats).find((seat) => seat.socketId === mySocketId);
        }

        function renderState(state) {
            document.getElementById('blackScore').textContent = state.scores.black;
            document.getElementById('whiteScore').textContent = state.scores.white;
            document.getElementById('myColor').textContent = `색상: ${myColor ? colorName(myColor) : '입찰 중'}`;
            
            renderBoard(state.board, state.lastMove);
            renderPanels(state);
            renderLog(state.log);
            
            // 초기 렌더링 시 UI 요소 업데이트
            updateLiveElements(state);
            renderDecisionPanels(state);
            renderGameInfo(state);
            renderBoardActions(state);
            renderAugmentSummary(state);
            document.getElementById('leaveBtn').classList.toggle('hidden', state.phase !== 'finished');
            
            document.querySelector('.game-layout').classList.toggle('board-focus-mode', Boolean(roomId) && state.phase !== 'finished');

            if (state.winner) {
                document.getElementById('status').textContent = `${colorName(state.winner)} 승리!`;
            } else if (state.phase === 'finished') {
                document.getElementById('status').textContent = '게임 종료';
            } else if (state.phase === 'bidding') {
                document.getElementById('status').textContent = '흑 입찰 단계';
            } else if (state.phase === 'augment-selection') {
                const stepColor = state.selection?.steps?.[state.selection.index]?.color;
                const label = stepColor ? `${colorName(stepColor)} 증강 선택 단계` : '증강 선택 단계';
                document.getElementById('status').textContent = stepColor === myColor ? `${label} - 내가 선택할 차례` : label;
            } else if (state.phase === 'playing') {
                const turnText = `${colorName(state.turn)} 차례`;
                document.getElementById('status').textContent = state.turn === myColor ? `${turnText} - 내가 둘 차례` : turnText;
            }
        }

        // 0.2초마다 타이머와 HUD의 시간만 업데이트 (전체 리렌더링 방지)
        setInterval(() => {
            if (!currentState) return;
            updateLiveElements(currentState);
        }, 200);

        function updateLiveElements(state) {
            const now = Date.now();
            
            // 상단 클락 정보 업데이트
            const clockInfo = document.getElementById('clockInfo');
            const isLiveTurn = state.phase === 'playing' && !state.winner;
            const blackDisplay = calculateLiveClock(state.clock.black, isLiveTurn && state.turn === 'black' ? state.clock.turnStartedAt : null, now);
            const whiteDisplay = calculateLiveClock(state.clock.white, isLiveTurn && state.turn === 'white' ? state.clock.turnStartedAt : null, now);
            clockInfo.innerHTML = `<div>흑: ${blackDisplay}</div><div>백: ${whiteDisplay}</div>`;

            // HUD 업데이트
            renderPlayerHud(state, now);
            
            // 페이즈 오버레이(타이머) 업데이트
            renderPhaseOverlay(state, now);
        }

        function calculateLiveClock(clockEntry, turnStartedAt, now) {
            let mainMs = clockEntry.mainMs;
            let chipMs = clockEntry.chipMs;
            let inChip = clockEntry.inChip || mainMs <= 0;

            if (turnStartedAt) {
                let elapsedMs = now - turnStartedAt;
                if (mainMs > 0) {
                    const spentMain = Math.min(mainMs, elapsedMs);
                    mainMs -= spentMain;
                    elapsedMs -= spentMain;
                }
                if (elapsedMs > 0) {
                    inChip = true;
                    chipMs = Math.max(0, chipMs - elapsedMs);
                }
            }

            const mainSec = Math.max(0, Math.ceil(mainMs / 1000));
            const chipSec = Math.max(0, Math.ceil(chipMs / 1000));

            if (!inChip) return `${formatSeconds(mainSec)} (초읽기 20초)`;
            return `<span class="warning">0:00 (초읽기 ${chipSec}초)</span>`;
        }

        function formatSeconds(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}:${String(seconds).padStart(2, '0')}`;
        }

        function renderBoard(boardState, lastMove) {
            boardState.flat().forEach((stone, index) => {
                const cell = board.children[index];
                const x = Number(cell.dataset.x);
                const y = Number(cell.dataset.y);
                const isLastMove = lastMove && lastMove.x === x && lastMove.y === y;
                cell.className = `cell ${stone || ''}${isLastMove ? ' last-move' : ''}`;
            });
        }

        function renderPanels(state) {
            const bidPanel = document.getElementById('bidPanel');
            const augmentPanel = document.getElementById('augmentPanel');
            bidPanel.classList.toggle('hidden', state.phase !== 'bidding');
            
            if (state.phase === 'bidding' && document.activeElement !== document.getElementById('bidInput')) {
                document.getElementById('bidInput').value = pendingBidValue;
            }

            const step = state.selection?.steps?.[state.selection.index];
            augmentPanel.classList.toggle('hidden', state.phase !== 'augment-selection' || !step);

            if (state.phase === 'augment-selection' && step) {
                const chooserColor = step.color;
                const player = state.players[chooserColor];
                const selected = new Set(player.selectedAugmentIds || []);
                const source = step.source === 'reserve' ? player.reserveAugments : player.choices;
                const availableChoices = source.filter((augment) => !selected.has(augment.id));
                const required = Math.min(availableChoices.length, step.count);
                const isMySelection = chooserColor === myColor;

                document.getElementById('augmentHelp').textContent = isMySelection
                    ? `${colorName(chooserColor)} 증강 선택 차례입니다. ${required}개를 선택하세요.`
                    : `${colorName(chooserColor)}가 증강을 선택하고 있습니다.`;

                const choicesDiv = document.getElementById('augmentChoices');
                choicesDiv.innerHTML = availableChoices.map((augment) => `
                    <label class="augment-card compact augment-choice">
                        <input type="checkbox" value="${augment.id}" data-required="${required}" ${!isMySelection ? 'disabled' : ''}>
                        <strong>${augment.name}</strong>
                        <span>${augment.description}</span>
                    </label>
                `).join('');
            }
        }

        function renderPlayerHud(state, now) {
            const hud = document.getElementById('playerHud');
            const isLiveTurn = state.phase === 'playing' && !state.winner;
            
            hud.innerHTML = ['black', 'white'].map((color) => {
                const player = state.players[color];
                const clock = calculateLiveClock(state.clock[color], isLiveTurn && state.turn === color ? state.clock.turnStartedAt : null, now);
                const turnClass = state.phase === 'playing' && state.turn === color ? ' active-turn' : '';
                return `
                    <button class="hud-player${turnClass}" type="button" data-modal="${color}-all">
                        <span class="hud-color">${colorName(color)}</span>
                        <strong>${player?.user?.nickname || '대기 중'}</strong>
                        <span class="hud-score">${state.scores[color]}점</span>
                        <span class="hud-clock">${clock}</span>
                    </button>
                `;
            }).join('');
        }

        function renderPhaseOverlay(state, now) {
            const overlay = document.getElementById('phaseOverlay');
            const remainingMs = state.decisionDeadlineAt ? Math.max(0, state.decisionDeadlineAt - now) : null;
            const remainingText = remainingMs === null ? '' : `<strong class="phase-time">${Math.ceil(remainingMs / 1000)}초</strong>`;
            let title = '';
            let description = '';

            if (state.phase === 'bidding') {
                title = '흑 입찰';
                description = `0~3점 양보 입찰 중 ${remainingText}`;
            } else if (state.phase === 'augment-selection') {
                const step = state.selection?.steps?.[state.selection.index];
                title = `${step?.color ? colorName(step.color) : '증강'} 선택`;
                description = `${step?.color === myColor ? '내가 선택할 차례' : '상대 선택 확인 중'} ${remainingText}`;
            } else if (state.phase === 'playing') {
                title = `${colorName(state.turn)} 착수`;
                description = state.turn === myColor ? '내 차례입니다' : '상대 차례입니다';
            } else if (state.winner) {
                title = `${colorName(state.winner)} 승리`;
                description = '게임 종료';
            } else {
                title = '게임 준비';
                description = '상태 확인 중';
            }

            overlay.innerHTML = `
                <div><strong>${title}</strong><span>${description}</span></div>
                ${remainingMs !== null ? `<progress max="${30 * 1000}" value="${remainingMs}"></progress>` : ''}
            `;
        }

        function renderBoardActions(state) {
            const actions = document.getElementById('boardActions');
            const buttons = [];
            if (state.phase === 'playing' && !state.winner) {
                buttons.push('<button type="button" class="surrender-button" data-board-surrender>항복</button>');
            }
            if (state.phase === 'finished') {
                buttons.push('<button type="button" onclick="window.location.href=\'lobby.html\'">로비로 나가기</button>');
            }
            actions.innerHTML = buttons.join('');
        }

        function renderAugmentSummary(state) {
            const summary = document.getElementById('augmentSummary');
            summary.innerHTML = ['black', 'white'].map((color) => {
                const player = state.players[color];
                if (!player) return '';
                return `
                    <article class="augment-summary-card">
                        <button type="button" data-modal="${color}-all"><strong>${colorName(color)} 증강</strong></button>
                        <p><span>활성</span> ${untriggered(player.activeAugments, player).map(a => a.name).join(', ') || '없음'}</p>
                        <p><span>대기</span> ${player.reserveAugments.map(a => a.name).join(', ') || '없음'}</p>
                        <p><span>손패</span> ${player.handAugments.map(a => a.name).join(', ') || '없음'}</p>
                        <p><span>발동됨</span> ${(player.triggeredAugments || []).map(a => a.name).join(', ') || '없음'}</p>
                    </article>
                `;
            }).join('');
        }

        function renderDecisionPanels(state) {
            renderBoardBidPanel(state);
            renderBoardSelectionPanel(state);
            document.getElementById('decisionBackdrop').classList.toggle('hidden', state.phase !== 'bidding' && state.phase !== 'augment-selection');
        }

        function renderBoardBidPanel(state) {
            const panel = document.getElementById('boardBidPanel');
            panel.classList.toggle('hidden', state.phase !== 'bidding');
            if (state.phase !== 'bidding') return;

            const seat = mySeat(state);
            panel.innerHTML = `
                <div class="board-selection-header">
                    <strong>흑 입찰</strong>
                    <span>${seat?.bid === null ? '점수를 양보해 흑을 입찰하세요' : '입찰 제출 완료'}</span>
                </div>
                <div class="bid-choice-grid">
                    ${[0, 1, 2, 3].map((value) => `
                        <button type="button" class="bid-choice${Number(pendingBidValue) === value ? ' selected' : ''}" data-bid-value="${value}" ${seat?.bid !== null ? 'disabled' : ''}>
                            <strong>${value}점</strong>
                            <span>양보</span>
                        </button>
                    `).join('')}
                </div>
                <button type="button" data-board-bid-confirm ${seat?.bid !== null ? 'disabled' : ''}>입찰 확정</button>
            `;
        }

        function renderBoardSelectionPanel(state) {
            const panel = document.getElementById('boardSelectionPanel');
            const step = state.selection?.steps?.[state.selection.index];
            panel.classList.toggle('hidden', state.phase !== 'augment-selection' || !step);
            if (state.phase !== 'augment-selection' || !step) return;

            const chooserColor = step.color;
            const player = state.players[chooserColor];
            const selected = new Set(player.selectedAugmentIds || []);
            const source = step.source === 'reserve' ? player.reserveAugments : player.choices;
            const availableChoices = source.filter((augment) => !selected.has(augment.id));
            const required = Math.min(availableChoices.length, step.count);
            const isMySelection = chooserColor === myColor;

            panel.innerHTML = `
                <div class="board-selection-header">
                    <strong>${colorName(chooserColor)} 증강 선택</strong>
                    <span>${isMySelection ? `${required}개 선택 후 확정` : '상대 선택 확인 중'}</span>
                </div>
                <div class="board-selection-list">
                    ${availableChoices.map((augment) => `
                        <button type="button" class="augment-card compact augment-choice${boardSelectedAugmentIds.includes(augment.id) ? ' selected' : ''}" data-augment-id="${augment.id}" data-required="${required}" ${!isMySelection ? 'disabled' : ''}>
                            <strong>${augment.name}</strong>
                            <span>${augment.description}</span>
                        </button>
                    `).join('')}
                </div>
                ${isMySelection ? '<button type="button" data-board-confirm>증강 확정</button>' : ''}
            `;
        }

        // 이벤트 리스너들
        document.getElementById('boardBidPanel').addEventListener('click', (event) => {
            const bidButton = event.target.closest('[data-bid-value]');
            if (bidButton) {
                pendingBidValue = Number(bidButton.dataset.bidValue);
                renderBoardBidPanel(currentState);
                return;
            }
            if (event.target.closest('[data-board-bid-confirm]')) {
                socket.emit('submitBid', { roomId, bid: pendingBidValue });
            }
        });

        document.getElementById('boardSelectionPanel').addEventListener('click', (event) => {
            const choiceButton = event.target.closest('[data-augment-id]');
            if (choiceButton && currentState?.phase === 'augment-selection') {
                const step = currentState.selection?.steps?.[currentState.selection.index];
                if (step?.color !== myColor) return;
                const id = Number(choiceButton.dataset.augmentId);
                const required = Number(choiceButton.dataset.required || 0);
                const exists = boardSelectedAugmentIds.includes(id);
                boardSelectedAugmentIds = exists
                    ? boardSelectedAugmentIds.filter(cid => cid !== id)
                    : [...boardSelectedAugmentIds, id].slice(-required);
                renderBoardSelectionPanel(currentState);
                return;
            }
            if (event.target.closest('[data-board-confirm]')) {
                socket.emit('selectAugments', { roomId, augmentIds: boardSelectedAugmentIds });
            }
        });

        // 모달 관련
        document.getElementById('playerHud').addEventListener('click', handleModalClick);
        document.getElementById('boardActions').addEventListener('click', (event) => {
            if (event.target.closest('[data-board-surrender]')) {
                document.getElementById('surrenderBackdrop').classList.remove('hidden');
                return;
            }
            handleModalClick(event);
        });
        document.getElementById('augmentSummary').addEventListener('click', handleModalClick);
        document.getElementById('augmentModalBody').addEventListener('click', handleModalClick);
        
        function handleModalClick(event) {
            const button = event.target.closest('[data-modal]');
            if (button && currentState) openAugmentModal(button.dataset.modal);
            const activateButton = event.target.closest('[data-activate-augment]');
            if (activateButton && currentState?.phase === 'playing') {
                socket.emit('activateAugment', { roomId, augmentId: Number(activateButton.dataset.activateAugment) });
            }
        }

        document.getElementById('surrenderCancelBtn').addEventListener('click', () => {
            document.getElementById('surrenderBackdrop').classList.add('hidden');
        });
        document.getElementById('surrenderConfirmBtn').addEventListener('click', () => {
            document.getElementById('surrenderBackdrop').classList.add('hidden');
            emitAndGoLobby('leaveRoom');
        });

        document.getElementById('augmentModalClose').addEventListener('click', closeAugmentModal);
        document.getElementById('augmentModal').addEventListener('click', (e) => { if (e.target.id === 'augmentModal') closeAugmentModal(); });

        function openAugmentModal(kind) {
            const [color, section] = kind.split('-');
            const title = document.getElementById('augmentModalTitle');
            const body = document.getElementById('augmentModalBody');
            if (kind === 'queue') {
                title.textContent = '증강 큐';
                body.innerHTML = renderQueueDetails(currentState.augmentQueue || []);
            } else {
                const player = currentState.players[color];
                title.textContent = `${colorName(color)} 증강 정보`;
                body.innerHTML = renderPlayerAugmentDetails(player, section);
            }
            document.getElementById('augmentModal').classList.remove('hidden');
        }

        function closeAugmentModal() { document.getElementById('augmentModal').classList.add('hidden'); }

        function renderPlayerAugmentDetails(player, section) {
            if (!player) return '<p>정보 없음</p>';
            const sections = section === 'all' ? ['active', 'reserve', 'hand', 'triggered'] : [section];
            return sections.map(s => `
                <section class="modal-section">
                    <h3>${sectionTitle(s)}</h3>
                    ${renderAugmentCards(sectionAugments(player, s), player.triggeredAugmentIds)}
                </section>
            `).join('');
        }

        function sectionTitle(s) {
            return { active: '활성화 증강', reserve: '대기 증강', hand: '손패 증강', triggered: '발동됨' }[s] || '증강';
        }
        function sectionAugments(p, s) {
            return { active: untriggered(p.activeAugments, p), reserve: p.reserveAugments, hand: p.handAugments, triggered: p.triggeredAugments || [] }[s] || [];
        }

        function renderAugmentCards(augments, triggeredIds = []) {
            if (!augments.length) return '<p>없음</p>';
            return augments.map(a => `
                <article class="modal-augment-card">
                    <strong>${a.name}${triggeredIds.includes(a.id) ? ' (발동됨)' : ''}</strong>
                    <p>${a.description}</p>
                    ${currentState?.phase === 'playing' && (currentState.players[myColor]?.handAugments || []).some(h => h.id === a.id) ? `<button type="button" data-activate-augment="${a.id}">발동</button>` : ''}
                </article>
            `).join('');
        }

        function untriggered(augments = [], player = {}) {
            const triggered = new Set(player.triggeredAugmentIds || []);
            return augments.filter((augment) => !triggered.has(augment.id));
        }

        function renderQueueDetails(queue) {
            if (!queue.length) return '<p>비어 있음</p>';
            return renderAugmentCards(queue.map(e => ({ ...e.augment, name: `${colorName(e.color)} · ${e.augment.name}` })));
        }

        function renderGameInfo(state) {
            const info = document.getElementById('gameInfo');
            info.innerHTML = ['black', 'white'].map(c => {
                const p = state.players[c];
                if (!p) return '';
                return `<article class="player-info"><h2>${colorName(c)} - ${p.user.nickname}</h2><p>입찰: ${p.bid ?? '?'}</p></article>`;
            }).join('');
            info.classList.toggle('hidden', !info.innerHTML);
        }

        function renderLog(log) { document.getElementById('log').innerHTML = log.map(i => `<p>${i}</p>`).join(''); }
        function colorName(c) { return c === 'black' ? '흑' : '백'; }
    </script>
</body>
</html>
