<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오둑 게임</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main class="game-layout">
        <section class="panel">
            <h1>오둑</h1>
            <p id="status">로그인 확인 중...</p>
            <p>흑 <span id="blackScore">0</span> : 백 <span id="whiteScore">0</span></p>
            <p id="clockInfo">제한시간: 기본 5분 + 20초 초읽기</p>
            <p id="myColor">색상: 미정</p>

            <div id="matchPanel">
                <button id="matchBtn">매칭 시작</button>
            </div>

            <div id="bidPanel" class="hidden">
                <h2>흑 입찰</h2>
                <p>0~3점까지 양보할 수 있습니다. 더 많이 양보한 사람이 흑이 됩니다.</p>
                <label>양보 점수 <input id="bidInput" type="number" min="0" max="3" value="0"></label>
                <button id="bidBtn">입찰 제출</button>
            </div>

            <div id="augmentPanel" class="hidden">
                <h2>증강 선택</h2>
                <p id="augmentHelp"></p>
                <div id="augmentChoices" class="augment-list"></div>
                <button id="augmentBtn">증강 확정</button>
            </div>

            <div id="log" class="log"></div>
            <a id="leaveBtn" class="button-link" href="lobby.html">나가기</a>
        </section>

        <section class="board-stage" aria-label="오둑판 집중 정보 영역">
            <div id="phaseOverlay" class="phase-overlay"></div>
            <div id="boardSelectionPanel" class="board-selection-panel hidden"></div>
            <div id="playerHud" class="board-hud"></div>
            <section id="board" class="board" aria-label="11x11 오둑판"></section>
            <div id="boardActions" class="board-actions"></div>
        </section>
        <aside id="gameInfo" class="game-info hidden" aria-label="게임 정보"></aside>

        <div id="augmentModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="augmentModalTitle">
            <article class="modal-card">
                <button id="augmentModalClose" class="modal-close" type="button" aria-label="닫기">×</button>
                <h2 id="augmentModalTitle"></h2>
                <div id="augmentModalBody" class="modal-body"></div>
            </article>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const board = document.getElementById('board');
        const socket = io(API_BASE_URL, { withCredentials: true });
        let roomId = null;
        let currentState = null;
        let mySocketId = null;
        let myColor = null;
        let pendingBidValue = document.getElementById('bidInput').value;

        for (let y = 0; y < 11; y += 1) {
            for (let x = 0; x < 11; x += 1) {
                const cell = document.createElement('button');
                cell.className = 'cell';
                cell.dataset.x = x;
                cell.dataset.y = y;
                cell.addEventListener('click', () => {
                    if (!roomId || currentState?.phase !== 'playing') return;
                    if (currentState.turn !== myColor) return;
                    if (currentState.board[y][x]) return;

                    socket.emit('placeStone', { roomId, x, y });
                });
                board.appendChild(cell);
            }
        }

        requireLogin().then(() => {
            document.getElementById('status').textContent = '매칭을 시작하세요.';
        });

        socket.on('connect', () => {
            mySocketId = socket.id;
        });

        document.getElementById('matchBtn').addEventListener('click', () => {
            socket.emit('joinMatch');
            document.getElementById('matchBtn').disabled = true;
            document.getElementById('status').textContent = '상대를 기다리는 중...';
        });

        document.getElementById('bidInput').addEventListener('input', (event) => {
            pendingBidValue = event.target.value;
        });

        document.getElementById('bidBtn').addEventListener('click', () => {
            socket.emit('submitBid', {
                roomId,
                bid: Number(pendingBidValue)
            });
        });

        document.getElementById('augmentBtn').addEventListener('click', () => {
            if (currentState?.phase !== 'augment-selection') return;

            const stepColor = currentState.selection?.steps?.[currentState.selection.index]?.color;
            if (stepColor !== myColor) return;

            const augmentIds = [...document.querySelectorAll('#augmentChoices input:checked')].map((input) => Number(input.value));
            socket.emit('selectAugments', { roomId, augmentIds });
        });

        document.getElementById('leaveBtn').addEventListener('click', (event) => {

            event.preventDefault();

            if (roomId && currentState?.phase !== 'finished') {
                emitAndGoLobby('leaveRoom');
            } else if (document.getElementById('matchBtn').disabled) {
                emitAndGoLobby('cancelMatch');
            } else {
                window.location.href = 'lobby.html';
            }
        });

        function emitAndGoLobby(eventName) {
            let moved = false;
            const goLobby = () => {
                if (moved) return;
                moved = true;
                window.location.href = 'lobby.html';
            };

            socket.timeout(1000).emit(eventName, () => {
                goLobby();
            });
            setTimeout(goLobby, 1200);
        }


        window.addEventListener('pagehide', () => {
            if (roomId && currentState?.phase !== 'finished') {
                socket.emit('leaveRoom');
            } else if (document.getElementById('matchBtn').disabled) {
                socket.emit('cancelMatch');
            }
        });

        socket.on('matchFound', (data) => {
            roomId = data.roomId;
            document.getElementById('matchPanel').classList.add('hidden');
        });

        socket.on('gameState', (state) => {
            currentState = state;
            myColor = findMyColor(state);
            renderState(state);
        });

        socket.on('gameError', (msg) => {
            document.getElementById('matchBtn').disabled = false;
            alert(msg);
        });

        socket.on('roomClosed', (msg) => {
            document.getElementById('matchBtn').disabled = false;
            document.getElementById('matchPanel').classList.remove('hidden');
            roomId = null;
            currentState = null;
            alert(msg);
        });

        function findMyColor(state) {
            if (state.players.black?.socketId === mySocketId) return 'black';
            if (state.players.white?.socketId === mySocketId) return 'white';
            return null;
        }

        function mySeat(state) {
            return Object.values(state.seats).find((seat) => seat.socketId === mySocketId);
        }

        function renderState(state) {
            document.getElementById('blackScore').textContent = state.scores.black;
            document.getElementById('whiteScore').textContent = state.scores.white;
            document.getElementById('myColor').textContent = `색상: ${myColor ? colorName(myColor) : '입찰 중'}`;
            renderClock(state);

            renderBoard(state.board, state.lastMove);
            renderPanels(state);
            renderBoardFocusInfo(state);
            renderBoardSelectionPanel(state);
            renderGameInfo(state);
            renderLog(state.log);

            if (state.winner) {
                document.getElementById('status').textContent = `${colorName(state.winner)} 승리!`;
            } else if (state.phase === 'finished') {
                document.getElementById('status').textContent = '게임 종료';
            } else if (state.phase === 'bidding') {
                document.getElementById('status').textContent = '흑 입찰 단계';
            } else if (state.phase === 'augment-selection') {
                const stepColor = state.selection?.steps?.[state.selection.index]?.color;
                const label = stepColor ? `${colorName(stepColor)} 증강 선택 단계` : '증강 선택 단계';
                document.getElementById('status').textContent = stepColor === myColor ? `${label} - 내가 선택할 차례` : label;
            } else if (state.phase === 'playing') {
                const turnText = `${colorName(state.turn)} 차례`;
                document.getElementById('status').textContent = state.turn === myColor ? `${turnText} - 내가 둘 차례` : turnText;
            }
        }


        // 클라이언트 타이머 렌더 루프
        setInterval(() => {
            if (!currentState || !currentState.clock) return;

            const clockInfo = document.getElementById('clockInfo');
            const now = Date.now();

            const blackDisplay = calculateLiveClock(currentState.clock.black, currentState.turn === 'black' ? currentState.clock.turnStartedAt : null, now);
            const whiteDisplay = calculateLiveClock(currentState.clock.white, currentState.turn === 'white' ? currentState.clock.turnStartedAt : null, now);

            clockInfo.innerHTML = `
                <div>흑: ${blackDisplay}</div>
                <div>백: ${whiteDisplay}</div>
            `;

            renderBoardFocusInfo(currentState);
        }, 200); // 0.2초마다 갱신하여 더 부드럽게 표시

        function renderClock(state) {
            // 이 함수는 이제 상단의 전역 setInterval에서 처리함
        }

        function calculateLiveClock(clockEntry, turnStartedAt, now) {
            let mainMs = clockEntry.mainMs;
            let chipMs = clockEntry.chipMs;
            let inChip = clockEntry.inChip || mainMs <= 0;

            if (turnStartedAt) {
                let elapsedMs = now - turnStartedAt;
                
                // 본시간 차감
                if (mainMs > 0) {
                    const spentMain = Math.min(mainMs, elapsedMs);
                    mainMs -= spentMain;
                    elapsedMs -= spentMain;
                }
                
                // 초읽기 차감
                if (elapsedMs > 0) {
                    inChip = true;
                    chipMs = Math.max(0, chipMs - elapsedMs);
                }
            }

            const mainSec = Math.max(0, Math.ceil(mainMs / 1000));
            const chipSec = Math.max(0, Math.ceil(chipMs / 1000));

            if (!inChip) {
                return `${formatSeconds(mainSec)} (초읽기 20초)`;
            }
            // 초읽기 돌입 시: 본시간은 0:00으로 고정하고 초읽기 숫자가 줄어드는 것을 강조
            return `<span class="warning">0:00 (초읽기 ${chipSec}초)</span>`;
        }

        function formatClock(clock) {
            // 이 함수는 이제 renderClock 내부의 calculateLiveClock으로 대체됨
            return '';
        }

        function formatSeconds(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}:${String(seconds).padStart(2, '0')}`;
        }

        function renderBoard(boardState, lastMove) {
            boardState.flat().forEach((stone, index) => {
                const cell = board.children[index];
                const x = Number(cell.dataset.x);
                const y = Number(cell.dataset.y);
                const isLastMove = lastMove && lastMove.x === x && lastMove.y === y;
                cell.className = `cell ${stone || ''}${isLastMove ? ' last-move' : ''}`;
                cell.setAttribute('aria-label', isLastMove ? `마지막 착수: ${colorName(lastMove.color)} ${x + 1}, ${y + 1}` : `${x + 1}, ${y + 1}`);
            });
        }

        function renderPanels(state) {
            const bidPanel = document.getElementById('bidPanel');
            const augmentPanel = document.getElementById('augmentPanel');
            bidPanel.classList.toggle('hidden', state.phase !== 'bidding');
            if (state.phase === 'bidding' && document.activeElement !== document.getElementById('bidInput')) {
                document.getElementById('bidInput').value = pendingBidValue;
            }
            const step = state.selection?.steps?.[state.selection.index];
            augmentPanel.classList.toggle('hidden', state.phase !== 'augment-selection' || !step);

            if (state.phase === 'augment-selection' && step) {
                const chooserColor = step.color;
                const player = state.players[chooserColor];
                const selected = new Set(player.selectedAugmentIds || []);
                const source = step.source === 'reserve' ? player.reserveAugments : player.choices;
                const availableChoices = source.filter((augment) => !selected.has(augment.id));
                const required = Math.min(availableChoices.length, step.count);
                const isMySelection = chooserColor === myColor;

                document.getElementById('augmentHelp').textContent = isMySelection
                    ? `${colorName(chooserColor)} 증강 선택 차례입니다. ${required}개를 고른 뒤 확정하세요. 제한시간은 선택마다 30초입니다.`
                    : `${colorName(chooserColor)} 증강 선택 차례입니다. 상대 선택지를 확인할 수 있지만 선택할 수는 없습니다.`;
                document.getElementById('augmentBtn').classList.toggle('hidden', !isMySelection);
                document.getElementById('augmentBtn').disabled = false;
                document.getElementById('augmentBtn').textContent = '증강 확정';
                document.getElementById('augmentChoices').innerHTML = availableChoices.map((augment) => `
                    <label class="augment-card compact augment-choice${isMySelection ? '' : ' view-only'}">
                        ${isMySelection ? `<input type="checkbox" value="${augment.id}" data-required="${required}">` : ''}
                        <strong>${augment.name}</strong>
                        <span>${augment.description}</span>
                    </label>
                `).join('');
            } else {
                document.getElementById('augmentBtn').classList.remove('hidden');
                document.getElementById('augmentBtn').disabled = false;
                document.getElementById('augmentBtn').textContent = '증강 확정';
            }
        }


        document.getElementById('boardSelectionPanel').addEventListener('change', (event) => {
            if (event.target.type !== 'checkbox') return;

            const required = Number(event.target.dataset.required || 0);
            const checked = document.querySelectorAll('#boardSelectionPanel input:checked');

            if (required && checked.length > required) {
                event.target.checked = false;
                alert(`증강은 ${required}개만 선택할 수 있습니다.`);
            }
        });

        document.getElementById('boardSelectionPanel').addEventListener('click', (event) => {
            const confirmButton = event.target.closest('[data-board-confirm]');
            if (!confirmButton || currentState?.phase !== 'augment-selection') return;

            const stepColor = currentState.selection?.steps?.[currentState.selection.index]?.color;
            if (stepColor !== myColor) return;

            const augmentIds = [...document.querySelectorAll('#boardSelectionPanel input:checked')].map((input) => Number(input.value));
            socket.emit('selectAugments', { roomId, augmentIds });
        });

        function renderBoardSelectionPanel(state) {
            const panel = document.getElementById('boardSelectionPanel');
            const step = state.selection?.steps?.[state.selection.index];
            panel.classList.toggle('hidden', state.phase !== 'augment-selection' || !step);

            if (state.phase !== 'augment-selection' || !step) {
                panel.innerHTML = '';
                return;
            }

            const chooserColor = step.color;
            const player = state.players[chooserColor];
            const selected = new Set(player.selectedAugmentIds || []);
            const source = step.source === 'reserve' ? player.reserveAugments : player.choices;
            const availableChoices = source.filter((augment) => !selected.has(augment.id));
            const required = Math.min(availableChoices.length, step.count);
            const isMySelection = chooserColor === myColor;

            panel.innerHTML = `
                <div class="board-selection-header">
                    <strong>${colorName(chooserColor)} 증강 선택</strong>
                    <span>${isMySelection ? `${required}개 선택 후 확정` : '상대 선택지 공개'}</span>
                </div>
                <div class="board-selection-list">
                    ${availableChoices.map((augment) => `
                        <label class="augment-card compact augment-choice${isMySelection ? '' : ' view-only'}">
                            ${isMySelection ? `<input type="checkbox" value="${augment.id}" data-required="${required}">` : ''}
                            <strong>${augment.name}</strong>
                            <span>${augment.description}</span>
                        </label>
                    `).join('')}
                </div>
                ${isMySelection ? '<button type="button" data-board-confirm>보드에서 증강 확정</button>' : ''}
            `;
        }

        function renderBoardFocusInfo(state) {
            renderPlayerHud(state);
            renderPhaseOverlay(state);
            renderBoardActions(state);
        }

        function renderPlayerHud(state) {
            const hud = document.getElementById('playerHud');
            const now = Date.now();

            hud.innerHTML = ['black', 'white'].map((color) => {
                const player = state.players[color];
                const clock = calculateLiveClock(state.clock[color], state.turn === color ? state.clock.turnStartedAt : null, now);
                const turnClass = state.phase === 'playing' && state.turn === color ? ' active-turn' : '';
                return `
                    <button class="hud-player${turnClass}" type="button" data-modal="${color}-all">
                        <span class="hud-color">${colorName(color)}</span>
                        <strong>${player?.user?.nickname || '대기 중'}</strong>
                        <span class="hud-score">${state.scores[color]}점</span>
                        <span class="hud-clock">${clock}</span>
                    </button>
                `;
            }).join('');
        }

        function renderPhaseOverlay(state) {
            const overlay = document.getElementById('phaseOverlay');
            const now = Date.now();
            const remainingMs = state.decisionDeadlineAt ? Math.max(0, state.decisionDeadlineAt - now) : null;
            const remainingText = remainingMs === null ? '' : `<strong class="phase-time">${Math.ceil(remainingMs / 1000)}초</strong>`;
            let title = '';
            let description = '';

            if (state.phase === 'bidding') {
                title = '흑 입찰';
                description = `0~3점 양보 입찰 중 ${remainingText}`;
            } else if (state.phase === 'augment-selection') {
                const step = state.selection?.steps?.[state.selection.index];
                const chooser = step?.color ? colorName(step.color) : '증강';
                title = `${chooser} 증강 선택`;
                description = `${step?.color === myColor ? '내가 선택할 차례' : '상대 선택 확인 중'} ${remainingText}`;
            } else if (state.phase === 'playing') {
                title = `${colorName(state.turn)} 착수`;
                description = state.turn === myColor ? '내 차례입니다' : '상대 차례입니다';
            } else if (state.winner) {
                title = `${colorName(state.winner)} 승리`;
                description = '게임 종료';
            } else {
                title = '게임 준비';
                description = '매칭 또는 진행 상태를 확인하세요';
            }

            overlay.innerHTML = `
                <div>
                    <strong>${title}</strong>
                    <span>${description}</span>
                </div>
                ${remainingMs === null ? '' : `<progress max="${30 * 1000}" value="${remainingMs}"></progress>`}
            `;
        }

        function renderBoardActions(state) {
            const actions = document.getElementById('boardActions');
            const buttons = [];

            for (const color of ['black', 'white']) {
                const player = state.players[color];
                if (!player) continue;
                buttons.push(`<button type="button" data-modal="${color}-active">${colorName(color)} 활성 ${player.activeAugments?.length || 0}</button>`);
                buttons.push(`<button type="button" data-modal="${color}-reserve">${colorName(color)} 대기 ${player.reserveAugments?.length || 0}</button>`);
                buttons.push(`<button type="button" data-modal="${color}-hand">${colorName(color)} 손패 ${player.handAugments?.length || 0}</button>`);
            }

            buttons.push(`<button type="button" data-modal="queue">증강 큐 ${state.augmentQueue?.length || 0}</button>`);
            actions.innerHTML = buttons.join('');
        }

        document.getElementById('playerHud').addEventListener('click', (event) => {
            const button = event.target.closest('[data-modal]');
            if (!button || !currentState) return;
            openAugmentModal(button.dataset.modal);
        });

        document.getElementById('boardActions').addEventListener('click', (event) => {
            const button = event.target.closest('[data-modal]');
            if (!button || !currentState) return;
            openAugmentModal(button.dataset.modal);
        });

        document.getElementById('augmentModalClose').addEventListener('click', closeAugmentModal);
        document.getElementById('augmentModal').addEventListener('click', (event) => {
            if (event.target.id === 'augmentModal') closeAugmentModal();
        });

        function openAugmentModal(kind) {
            const [color, section] = kind.split('-');
            const modal = document.getElementById('augmentModal');
            const title = document.getElementById('augmentModalTitle');
            const body = document.getElementById('augmentModalBody');

            if (kind === 'queue') {
                title.textContent = '증강 큐';
                body.innerHTML = renderQueueDetails(currentState.augmentQueue || []);
            } else {
                const player = currentState.players[color];
                title.textContent = `${colorName(color)} ${player?.user?.nickname || ''} 증강 정보`;
                body.innerHTML = renderPlayerAugmentDetails(player, section);
            }

            modal.classList.remove('hidden');
        }

        function closeAugmentModal() {
            document.getElementById('augmentModal').classList.add('hidden');
        }

        function renderPlayerAugmentDetails(player, section) {
            if (!player) return '<p>플레이어 정보가 없습니다.</p>';

            const groups = section === 'all'
                ? [
                    ['활성화 증강', player.activeAugments || []],
                    ['돌이 잡힌 뒤 활성화할 수 있는 대기 증강', player.reserveAugments || []],
                    ['직접 사용할 수 있는 손패 증강', player.handAugments || []]
                ]
                : [[sectionTitle(section), sectionAugments(player, section)]];

            return groups.map(([groupTitle, augments]) => `
                <section class="modal-section">
                    <h3>${groupTitle}</h3>
                    ${renderAugmentCards(augments, player.triggeredAugmentIds || [])}
                </section>
            `).join('');
        }

        function renderQueueDetails(queue) {
            if (!queue.length) return '<p>현재 대기 중인 증강 큐가 없습니다.</p>';
            return renderAugmentCards(queue.map((entry) => ({
                ...entry.augment,
                name: `${colorName(entry.color)} · ${entry.augment.name}`
            })));
        }

        function sectionTitle(section) {
            if (section === 'active') return '활성화 증강';
            if (section === 'reserve') return '돌이 잡힌 뒤 활성화할 수 있는 대기 증강';
            if (section === 'hand') return '직접 사용할 수 있는 손패 증강';
            return '증강 정보';
        }

        function sectionAugments(player, section) {
            if (section === 'active') return player.activeAugments || [];
            if (section === 'reserve') return player.reserveAugments || [];
            if (section === 'hand') return player.handAugments || [];
            return [];
        }

        function renderAugmentCards(augments, triggeredIds = []) {
            if (!augments.length) return '<p>없음</p>';

            return augments.map((augment) => `
                <article class="modal-augment-card">
                    <strong>${augment.name}${triggeredIds.includes(augment.id) ? ' (발동됨)' : ''}</strong>
                    <small>${activationTypeName(augment.activationType)}</small>
                    <p>${augment.description || '설명이 없습니다.'}</p>
                </article>
            `).join('');
        }

        function renderGameInfo(state) {
            const gameInfo = document.getElementById('gameInfo');
            const entries = ['black', 'white']
                .map((color) => renderPlayerInfo(color, state.players[color], state.phase))
                .filter(Boolean)
                .join('');

            gameInfo.classList.toggle('hidden', !entries);
            gameInfo.innerHTML = entries;
        }

        function renderPlayerInfo(color, player, phase) {
            if (!player) return '';

            const readyText = phase === 'augment-selection'
                ? `<p>증강 준비: ${player.ready ? '완료' : '대기 중'}</p>`
                : '';
            const startAugments = renderAugmentList('활성화 증강', player.activeAugments, player.triggeredAugmentIds);
            const captureAugments = renderAugmentList(player.reserveActivated ? '활성화 완료된 대기 증강' : '대기 증강', player.reserveAugments, player.triggeredAugmentIds, true);
            return `
                <article class="player-info">
                    <h2>${colorName(color)} - ${player.user.nickname}</h2>
                    ${readyText}
                    ${phase === 'bidding' ? '<p>입찰 정보는 양쪽 제출 후 공개됩니다.</p>' : `<p>입찰: ${player.bid ?? 0}</p>`}
                    ${phase === 'playing' || phase === 'finished' ? `${startAugments}${captureAugments}` : '<p>선택 증강은 양쪽 준비 완료 후 공개됩니다.</p>'}
                </article>
            `;
        }

        function renderAugmentList(title, augments, triggeredIds = [], hideIfEmpty = false) {
            if (!augments?.length) {
                return hideIfEmpty ? '' : `<p>${title}: 없음</p>`;
            }

            return `
                <div class="augment-status">
                    <strong>${title}</strong>
                    ${augments.map((augment) => `
                        <div class="augment-card compact">
                            <span>${augment.name}${triggeredIds.includes(augment.id) ? ' (발동됨)' : ''}</span>
                            <small>${activationTypeName(augment.activationType)}</small>
                            <small>${augment.description}</small>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        document.getElementById('augmentChoices').addEventListener('change', (event) => {
            if (event.target.type !== 'checkbox') return;

            const required = Number(event.target.dataset.required || 0);
            const checked = document.querySelectorAll('#augmentChoices input:checked');

            if (required && checked.length > required) {
                event.target.checked = false;
                alert(`시작 증강은 ${required}개만 선택할 수 있습니다.`);
            }
        });

        function renderLog(log) {
            document.getElementById('log').innerHTML = log.map((item) => `<p>${item}</p>`).join('');
        }

        function colorName(color) {
            return color === 'black' ? '흑' : '백';
        }

        function activationTypeName(type) {
            if (type === 'immediate') return '활성화 즉시 발동';
            if (type === 'manual') return '직접 사용 시 발동';
            return '조건 만족 시 자동 발동';
        }
    </script>
</body>
</html>
